# Rebuilds the static /jobs/ pages and sitemap.xml from live Firestore jobs,
# so Google can index each job (Google for Jobs). Commits only when something changed.
name: Build job pages

on:
  schedule:
    - cron: "17 */2 * * *" # every 2 hours
  workflow_dispatch: {}      # "Run workflow" button in the Actions tab

permissions:
  contents: write

concurrency:
  group: job-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/build-job-pages.mjs
      - name: Commit changes
        run: |
          git add -A jobs sitemap.xml
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git config user.name "jsph-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update job pages"
          git push
